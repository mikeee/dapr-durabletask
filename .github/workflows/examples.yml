name: Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

jobs:
  discover-examples:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.examples.outputs.examples }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build examples matrix
        id: examples
        run: |
          set -euo pipefail
          examples="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          examples = sorted(
              target["name"]
              for package in metadata["packages"]
              if package["name"] == "dapr-durabletask"
              for target in package["targets"]
              if "example" in target["kind"]
          )
          if not examples:
              raise SystemExit("No dapr-durabletask examples found")
          print(json.dumps(examples))
          '
          )"
          echo "examples=${examples}" >> "$GITHUB_OUTPUT"
          echo "Discovered examples: ${examples}"

  examples:
    name: Run example (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: discover-examples
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover-examples.outputs.examples) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ${{ runner.os }}-stable-examples
          key: examples
          cache-on-failure: true

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v13

      - name: Prefetch flake inputs (with retry)
        run: |
          for attempt in 1 2 3 4 5; do
            if nix flake archive --json >/dev/null; then
              echo "Flake inputs fetched on attempt $attempt"
              exit 0
            fi
            echo "::warning::Flake fetch attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Failed to prefetch flake inputs after 5 attempts"
          exit 1

      - name: Start durabletask-go sidecar
        run: |
          nix develop .#stable --command bash <<'BASH'
          set -euo pipefail
          nohup "$DURABLETASK_SIDECAR_BIN" --port 4001 >sidecar.log 2>&1 &
          echo $! > sidecar.pid
          disown || true
          for _ in $(seq 1 40); do
            if (echo >/dev/tcp/127.0.0.1/4001) 2>/dev/null; then
              echo "Sidecar ready on :4001"
              exit 0
            fi
            sleep 0.25
          done
          echo "Sidecar failed to start" >&2
          cat sidecar.log >&2
          exit 1
          BASH

      - name: Run example
        run: |
          nix develop .#stable --command bash <<'BASH'
          DURABLETASK_SKIP_SIDECAR=1 \
          timeout 120s cargo run -p dapr-durabletask --example "$EXAMPLE"
          BASH
        env:
          DURABLETASK_SKIP_SIDECAR: "1"
          EXAMPLE: ${{ matrix.example }}
          RUST_LOG: info

      - name: Stop sidecar
        if: always()
        run: |
          if [ -f sidecar.pid ]; then
            kill "$(cat sidecar.pid)" 2>/dev/null || true
          fi

      - name: Upload sidecar log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sidecar-log-${{ matrix.example }}
          path: sidecar.log
          if-no-files-found: ignore
